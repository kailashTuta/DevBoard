name: OWASP ZAP DAST
on:
  workflow_call:
jobs:
    dast:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7 

            - name: Run OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@v0.15.0
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                target: 'http://${{ secrets.EC2_HOST }}:8080'
                fail_action: false
                allow_issue_writing: false
                