name: Sonar Qube Scan
on:
    workflow_call:

jobs:
    sonar-scan:
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: SonarQube Scan
              continue-on-error: true
              uses: SonarSource/sonarqube-scan-action@v8.4.0
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}