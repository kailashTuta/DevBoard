name: Sonar Qube Scan
on:
    workflow_call:

jobs:
    sonar-scan:
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js for Sonar analysis
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.2.0
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
                SONAR_SCANNER_SKIP_NODE_PROVISIONING: "true"