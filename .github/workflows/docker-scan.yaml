name: Docker Scan
on:
    workflow_call:

jobs:
    docker-file-lint:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folders: [backend, frontend]
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Dockerfile Lint
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: ${{ matrix.folders }}/Dockerfile

            - name: Setup Docker [Login]
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Docker Build ${{ matrix.folders }}
              run: docker build -t ${{vars.DOCKER_USERNAME}}/devboard-${{ matrix.folders }}:latest .
              working-directory: ${{ matrix.folders }}

            - name: Run Trivy Vulnerability Scan ${{ matrix.folders }}
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{vars.DOCKER_USERNAME}}/devboard-${{ matrix.folders }}:latest
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
